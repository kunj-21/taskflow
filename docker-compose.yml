# Full stack:           docker compose up --build
# Just infra for dev:   docker compose up -d postgres redis
# Scale the API:        docker compose up -d --scale api=3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:8080
      GOOGLE_CALLBACK_URL: http://localhost:8080/api/v1/auth/google/callback
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2

  migrate:
    build: ./server
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: ./server
    command: ["node", "src/jobs/worker.js"]
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # NGINX serves the built SPA and load-balances /api + /socket.io across API replicas.
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
